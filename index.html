<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Sim</title>
</head>
<body>
<!-- portable standalone build of the battle sim, generated 2026-11-19 from the editor index.html — self-contained, no engine needed -->
<style>
  /* Dark-styled UI (bars/dock are near-black pills), so declare it: browsers
     with auto-dark / night-mode content features then leave our pixels alone
     instead of "fixing" the bright battlefield for dark mode. */
  html { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#5d8a4a; overscroll-behavior:none; }
  body { text-align:left; font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select:none; user-select:none; color:#e8ece5; }
  @media (forced-colors: active) {
    /* High-contrast mode would flatten the game chrome into system colors;
       keep the authored UI (faction dots, pills, tabs) intact instead. */
    #bar, #bbar, #bbtabs .tab, .tb, .dot, .tally { forced-color-adjust: none; }
  }
  #topWrap {
    position:fixed; top:8px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; z-index:10;
    max-width:calc(100vw - 16px); pointer-events:none;
  }
  #bar {
    position:relative;
    display:flex; align-items:center; gap:6px;
    background:rgba(20,24,18,.82); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px;
    padding:6px 10px; max-width:calc(100vw - 16px);
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    pointer-events:auto;
  }
  #bar::-webkit-scrollbar { display:none; }
  /* HUD toggle hangs below the bar's center like the spawner tab under the dock */
  #barToggle {
    pointer-events:auto; border:1px solid rgba(255,255,255,.12); border-top:none;
    background:rgba(20,24,18,.6); color:#cfd6c9; cursor:pointer;
    padding:3px 16px 6px; border-radius:0 0 10px 10px; line-height:1;
  }
  #barToggle:hover { background:rgba(20,24,18,.92); color:#fff; }
  #barToggle.tb { width:auto; height:auto; }
  /* collapsed HUD hides the whole bar — only the below-center arrow tab remains;
     collapsed dock keeps its inline arrow tab */
  #bar.collapsed { display:none; }
  #bbar.collapsed > :not(#dockToggle) { display:none; }
  #bbar.collapsed { padding:2px; gap:0; min-width:0; bottom:0; }
  #bbar {
    position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center; gap:6px; min-width:182px;
    background:rgba(20,24,18,.82); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px;
    padding:6px 10px; z-index:10;
  }
  #bbar .tb { width:auto; min-width:38px; height:38px; border-radius:11px; padding:0 12px; }
  #bbar .tb svg { width:24px; height:24px; }
  #bbar .uname { font-size:12px; font-weight:800; letter-spacing:.02em; text-transform:capitalize; line-height:1; }
  #bbar .bgroup { display:flex; gap:6px; align-items:center; }
  #bbtabs { position:absolute; bottom:calc(100% - 1px); left:50%; transform:translateX(-50%); display:flex; gap:4px; }
  #bbtabs .tab { border:1px solid rgba(255,255,255,.12); border-bottom:none; background:rgba(20,24,18,.6); color:#cfd6c9; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:5px 12px 6px; border-radius:10px 10px 0 0; cursor:pointer; }
  #bbtabs .tab.on { background:rgba(20,24,18,.92); color:#fff; }
  /* spawner tab attached to the bottom of the unit menu (mirrors #bbtabs) */
  #bbspawn { position:absolute; top:calc(100% - 1px); left:50%; transform:translateX(-50%); display:flex; }
  #bbspawn .sptab { border:1px solid rgba(255,255,255,.12); border-top:none; background:rgba(20,24,18,.6); color:#cfd6c9; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:5px 14px 6px; border-radius:0 0 10px 10px; cursor:pointer; }
  #bbspawn .sptab.on { background:rgba(20,24,18,.92); color:#fff; }
  #spanel { position:fixed; z-index:30; background:rgba(20,24,18,.82); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 14px; color:#fff; width:232px; font-size:12px; box-shadow:0 6px 24px rgba(0,0,0,.45); pointer-events:none; }
  #spanel[hidden] { display:none; }
  #spanel input, #spanel button { pointer-events:auto; }
  #sphead { display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; text-transform:capitalize; margin-bottom:2px; }
  #spdot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  #spclose { margin-left:auto; width:26px; height:26px; border-radius:8px; border:1px solid transparent; background:transparent; color:#cfd6c9; font-size:15px; line-height:1; cursor:pointer; }
  #spclose:hover { background:rgba(255,255,255,.1); }
  #spanel label { display:block; margin:10px 0 2px; color:#cfd6c9; font-weight:700; }
  #spanel label span { color:#fff; float:right; font-variant-numeric:tabular-nums; }
  #spanel input[type=range] { width:100%; accent-color:#8fce7a; }
  #spalive { margin:8px 0 10px; color:#cfd6c9; font-variant-numeric:tabular-nums; }
  #spdel { width:100%; padding:7px 0; border-radius:10px; border:1px solid rgba(255,120,110,.4); background:rgba(200,60,50,.25); color:#ffb3ab; font-weight:800; cursor:pointer; }
  #spdel:hover { background:rgba(200,60,50,.4); }
  /* pre-placement spawner setup window (above the dock + its attached tabs,
     so it never covers the Soldiers/Objects switch) */
  #sppre { position:fixed; left:50%; transform:translateX(-50%); bottom:120px; max-height:calc(100vh - 200px); overflow-y:auto; z-index:30; background:rgba(20,24,18,.78); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 14px; color:#fff; width:250px; font-size:12px; box-shadow:0 6px 24px rgba(0,0,0,.45); pointer-events:none; }
  #sppre[hidden] { display:none; }
  #sppre input, #sppre button { pointer-events:auto; }
  #pphead { display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; text-transform:capitalize; margin-bottom:2px; }
  #ppdot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  #ppclose { margin-left:auto; width:26px; height:26px; border-radius:8px; border:1px solid transparent; background:transparent; color:#cfd6c9; font-size:15px; line-height:1; cursor:pointer; }
  #ppclose:hover { background:rgba(255,255,255,.1); }
  #sppre label { display:block; margin:10px 0 2px; color:#cfd6c9; font-weight:700; }
  #sppre label span { color:#fff; float:right; font-variant-numeric:tabular-nums; }
  #sppre input[type=range] { width:100%; accent-color:#8fce7a; }
  #sppre .hint { margin-top:8px; color:#cfd6c9; font-size:11px; line-height:1.5; }
  @media (max-width:640px) {
    #bar { gap:3px; padding:5px 6px; }
    .tb { width:28px; height:28px; border-radius:8px; }
    #bbar .tb { width:auto; height:34px; padding:0 10px; }
    .dot { width:20px; height:20px; }
    .tally { font-size:11px; min-width:30px; }
  }
  .tb {
    width:32px; height:32px; border-radius:9px; border:1px solid transparent;
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0; flex:0 0 auto; color:#cfd6c9; position:relative;
  }
  .tb:hover { background:rgba(255,255,255,.1); }
  .tb.on { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.25); color:#fff; }
  .tb svg { width:20px; height:20px; display:block; }
  .dot {
    width:24px; height:24px; border-radius:50%; cursor:pointer; flex:0 0 auto;
    border:2px solid rgba(255,255,255,.25); padding:0; position:relative;
  }
  .dot.on { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.35); }
  .sep { width:1px; height:22px; background:rgba(255,255,255,.15); flex:0 0 auto; }
  .tally {
    display:flex; align-items:center; gap:3px; color:#fff; font-size:12px; font-weight:700;
    font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:34px; justify-content:center;
    background:rgba(255,255,255,.07); border-radius:8px; padding:3px 6px; position:relative;
  }
  .tally i { width:9px; height:9px; border-radius:50%; display:block; }
  .tally.win { outline:2px solid gold; }
  #cv { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; cursor:crosshair; }
  #cv:focus { outline:none; }
  /* ghost-cursor overlay: its own canvas so the placement preview redraws at
     full input rate even when the world frame is heavy (fully zoomed out) */
  #ov { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; pointer-events:none; z-index:5; }
</style>

<div id="topWrap"><div id="bar"></div></div>
<div id="bbar"></div>
<canvas id="cv" tabindex="0"></canvas>
<canvas id="ov"></canvas>
<div id="spanel" hidden>
  <div id="sphead"><span id="spdot"></span><span id="sptitle">Spawner</span><button id="spclose" title="close">×</button></div>
  <label>Max units <span id="spmaxv"></span><input id="spmax" type="range" min="1" max="50" step="1"></label>
  <label>Cooldown <span id="spcdv"></span><input id="spcd" type="range" min="1" max="60" step="1"></label>
  <label>Spawn distance <span id="spdistv"></span><input id="spdist" type="range" min="20" max="100" step="1"></label>
  <div id="spalive"></div>
  <button id="spdel">Delete spawner</button>
</div>
<div id="sppre" hidden>
  <div id="pphead"><span id="ppdot"></span><span id="pptitle">Spawner</span><button id="ppclose" title="exit spawner mode">×</button></div>
  <label>Max units <span id="ppmaxv"></span><input id="ppmax" type="range" min="1" max="50" step="1"></label>
  <label>Cooldown <span id="ppcdv"></span><input id="ppcd" type="range" min="1" max="60" step="1"></label>
  <label>Spawn distance <span id="ppdistv"></span><input id="ppdist" type="range" min="20" max="100" step="1"></label>
  <div class="hint">Tap the field to place. Tap a placed spawner to tweak it afterwards.</div>
</div>

<script>
"use strict";
/* ============================================================
   BATTLE SIM — add a unit by adding one entry to UNIT_DEFS.
   Required fields: hp, speed, range, interval, damage, bulletSpeed,
   radius, gunLen, gunW, spread, pellets, aimJitter, hold, mag, reload.
   Optional hooks: update(u,dt,ctx), onFire(u,ctx), drawExtra(u,ctx)
   ============================================================ */
const UNIT_DEFS = {
  soldier: { name:"soldier", hp:110, speed:76,  range:250, interval:0.85, damage:34, bulletSpeed:560, radius:13, gunLen:20, gunW:5, spread:0.06, pellets:1, aimJitter:0.02, hold:0.7, mag:6, reload:1.6 },
  sniper:  { name:"sniper",  hp:75,  speed:66,  range:520, interval:3.2,  damage:130, bulletSpeed:950, radius:13, gunLen:36, gunW:3, spread:0.008,pellets:1, aimJitter:0.002, hold:1.0, mag:1, reload:3.6 },
};

const FACTIONS = {
  red:    "#e74c3c",
  blue:   "#3b9fe8",
  yellow: "#f2c531",
  purple: "#a678e8",
};
const FACTION_KEYS = Object.keys(FACTIONS);
const DARK = { red:"#8e2a22", blue:"#1f6396", yellow:"#9a7a15", purple:"#5f4390" };
// free-for-all look: every unit renders light-gray (faction only matters for teams)
const FFA_GRAY = "#c6c9d1", FFA_DARK = "#83878f";
function dispFaction(f) { return mode === "ffa" ? "ffa" : f; }
function fcol(f) { return mode === "ffa" ? FFA_GRAY : (FACTIONS[f] || "#fff"); }

let cv = null, ctx = null;
let ov = null, octx = null, ghostQueued = false; // placement-ghost overlay
function sizeOverlay() {
  if (!ov) { ov = document.getElementById("ov"); if (ov) octx = ov.getContext("2d"); }
  if (ov && cv) { ov.width = cv.width; ov.height = cv.height; }
}
// redraw the ghost soon (coalesced to one per frame): pointer input stays
// smooth even when the world render itself is slow
function queueGhost() {
  if (ghostQueued || !octx) return;
  ghostQueued = true;
  requestAnimationFrame(drawGhost);
}
const bar = document.getElementById("bar");
const bbar = document.getElementById("bbar");
function evPos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function toWorld(p) { return { x: p.x / zoom + cam.x, y: p.y / zoom + cam.y }; }
function clampCam() {
  // the visible world slice shrinks as you zoom in; zoomed out past the
  // fit, the field centers with void margins instead of pinning a corner
  const vw = W / zoom, vh = H / zoom;
  cam.x = vw >= FW ? (FW - vw) / 2 : Math.max(0, Math.min(FW - vw, cam.x));
  cam.y = vh >= FH ? (FH - vh) / 2 : Math.max(0, Math.min(FH - vh, cam.y));
}
// zoom around a screen point (wheel cursor / pinch midpoint / screen center)
function zoomAt(sx, sy, f) {
  const z0 = zoom;
  zoom = Math.max(zoomMin(), Math.min(ZOOM_MAX, z0 * f));
  if (zoom === z0) return;
  const wx = cam.x + sx / z0, wy = cam.y + sy / z0;
  cam.x = wx - sx / zoom; cam.y = wy - sy / zoom;
  clampCam();
}
const ptrs = new Map(); // live pointers (screen px) for two-finger pan/zoom
let pinch = null;       // {mx,my,d} last two-finger midpoint + spacing, while pinching
let strokeNew = null;   // placements made by the current paint stroke (for pinch-undo below)
let strokeMoved = false, strokeSX = 0, strokeSY = 0; // stroke start (screen px): a stroke that never moves can be taken back
let panDrag = null;     // {lx,ly} active button-drag pan (middle, or right once it moves)
let rDown = null;       // right-button anchor {x,y} in world coords: a drag becomes a pan (a tap does nothing)
function attachInput() {
  if (cv.__bound) return; cv.__bound = true;
  cv.addEventListener("contextmenu", e => e.preventDefault());
  // the bar/dock/panels are HTML above the canvas: right-clicking them
  // would pop the native menu mid-game, so suppress it app-wide (the game
  // has no text fields that need it)
  if (!window.__ctxBound) { window.__ctxBound = true; document.addEventListener("contextmenu", e => e.preventDefault()); }
  // middle-click would autoscroll — we pan with it instead
  cv.addEventListener("mousedown", e => { if (e.button === 1) e.preventDefault(); });
  cv.addEventListener("pointerdown", e => {
    // clicking the field takes keyboard focus, so WASD/arrows pan from here
    try { cv.focus({ preventScroll: true }); } catch (_) { try { cv.focus(); } catch (_) {} }
    lastBarrPlant = null; // new stroke: chained fills link from this press, not the last one
    const p = evPos(e), w = toWorld(p);
    ptrs.set(e.pointerId, { x: p.x, y: p.y });
    if (ptrs.size === 2) { // second finger lands: pan/zoom, never paint/erase
      painting = false; erasing = false; panDrag = null; rDown = null;
      // a pinch that starts before the first finger even moves takes back
      // the tap it interrupted — otherwise every pinch-zoom drops a stray
      // unit (or spawner/tree/wall) under the first finger. A stroke that
      // already dragged keeps everything it laid down.
      if (strokeNew && !strokeMoved) {
        for (const rec of strokeNew) {
          const i = rec.arr.indexOf(rec.o);
          if (i >= 0) rec.arr.splice(i, 1);
        }
        if (strokeNew.length) refreshBar();
      }
      strokeNew = null;
      const q = [...ptrs.values()];
      pinch = { mx: (q[0].x + q[1].x) / 2, my: (q[0].y + q[1].y) / 2,
                d: Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    if (e.button === 1) { // middle-drag pans
      panDrag = { lx: p.x, ly: p.y };
      cv.style.cursor = "grabbing";
      e.preventDefault();
    } else if (e.button === 2) { // right-drag pans; a right TAP is a no-op
      // (deliberately: right-click never erases and never drops the brush
      // or a selection — Esc cancels those. An earlier revision erased on
      // tap-up here, which read as the app randomly entering eraser mode.)
      rDown = { x: w.x, y: w.y, sx: p.x, sy: p.y };
    }
    else if (brush.eraser) { erasing = true; eraseAt(w.x, w.y); strokeNew = null; }
    else if (brush.spawner) {
      // spawner mode: tapping an existing spawner selects it for tweaking,
      // tapping empty ground places a new one (dragging places a trail).
      // Placing never touches the setup window — it stays open so more
      // spawners can follow with the same settings.
      const hit = spawnerAt(w.x, w.y);
      if (hit) { selectSpawner(hit); painting = false; strokeNew = null; }
      else { strokeNew = []; strokeMoved = false; strokeSX = p.x; strokeSY = p.y; const sp = placeSpawner(w.x, w.y); if (sp && strokeNew) strokeNew.push({ arr: spawners, o: sp }); if (!sp) poof(w.x, w.y, "#999999", 4); painting = true; }
    }
    else if (brush.tab === "objects") {
      // objects mode: tapping a placed barricade selects it (scroll rotates it),
      // tapping empty ground plants the picked object (dragging lays a trail)
    const hitB = barricadeAt(w.x, w.y);
    if (hitB) { selectBarrPicked(hitB); painting = false; strokeNew = null; queueGhost(); }
      else { strokeNew = []; strokeMoved = false; strokeSX = p.x; strokeSY = p.y; painting = true; paintAt(w.x, w.y); }
    }
    else { strokeNew = []; strokeMoved = false; strokeSX = p.x; strokeSY = p.y; painting = true; paintAt(w.x, w.y); }
    mouse.x = p.x; mouse.y = p.y; mouse.down = true;
    queueGhost();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const endPointer = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    strokeNew = null; // stroke over (anything it placed is committed)
    if (e.button === 1 && panDrag) { panDrag = null; cv.style.cursor = ""; }
    if (e.button === 2) {
      rDown = null; // tap: nothing (erasing lives on the eraser tool, not here)
      if (panDrag) { panDrag = null; cv.style.cursor = ""; } // drag: end pan
    }
  };
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", endPointer);
  cv.addEventListener("pointermove", e => {
    const p = evPos(e); mouse.x = p.x; mouse.y = p.y;
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: p.x, y: p.y });
    if (pinch && ptrs.size >= 2) { // two fingers: pinch-zoom + pan by midpoint delta
      const q = [...ptrs.values()];
      const mx = (q[0].x + q[1].x) / 2, my = (q[0].y + q[1].y) / 2;
      const nd = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
      const dxm = mx - pinch.mx, dym = my - pinch.my;
      if (pinch.d > 0 && nd > 0) zoomAt(mx, my, nd / pinch.d);
      cam.x -= dxm / zoom; cam.y -= dym / zoom; clampCam();
      pinch = { mx, my, d: nd };
      queueGhost();
      return;
    }
    if (panDrag) {
      const dx = p.x - panDrag.lx, dy = p.y - panDrag.ly;
      if (dx || dy) { cam.x -= dx / zoom; cam.y -= dy / zoom; clampCam(); panDrag.lx = p.x; panDrag.ly = p.y; queueGhost(); }
      return;
    }
    if (rDown) { // right held: a drag becomes a pan, a tap does nothing
      if (Math.hypot(p.x - rDown.sx, p.y - rDown.sy) > 6) {
        panDrag = { lx: p.x, ly: p.y };
        cv.style.cursor = "grabbing";
        rDown = null;
      }
      return;
    }
    const w = toWorld(p);
    if (painting && Math.hypot(p.x - strokeSX, p.y - strokeSY) > 6) strokeMoved = true; // dragged: a later pinch keeps this stroke's placements
    if (painting) paintAt(w.x, w.y);
    else if (erasing) eraseAt(w.x, w.y);
    queueGhost();
  });
  // the spawner panels are click-through (taps fall to the field), so forward
  // wheel gestures over them to their own scroll offset instead; anywhere
  // else the wheel zooms around the cursor
  cv.addEventListener("wheel", e => {
    for (const id of ["sppre", "spanel"]) {
      const p = document.getElementById(id);
      if (!p || p.hidden) continue;
      const b = p.getBoundingClientRect();
      if (e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom) {
        if (p.scrollHeight > p.clientHeight + 1) { p.scrollTop += e.deltaY; e.preventDefault(); return; }
        // panel fits: let the wheel fall through to zoom/rotate instead of swallowing it
        continue;
      }
    }
    e.preventDefault();
    // barricade rotation rides the wheel: a selected wall spins in place,
    // otherwise the placement ghost spins while the barricade brush is
    // picked. Anything else zooms around the cursor as before.
    const wd = (e.deltaMode ? e.deltaY * 16 : e.deltaY) || 0; // lines -> px
    if (selBarr && trees.includes(selBarr)) {
      selBarr.dir = ((((selBarr.dir || 0) + (wd < 0 ? -1 : 1)) % 8) + 8) % 8;
      pendingBarrDir = selBarr.dir; // placements inherit the spun wall
      queueGhost();
      return;
    }
    if (brush.unit === "barricade") {
      pendingBarrDir = ((((pendingBarrDir | 0) + (wd < 0 ? -1 : 1)) % 8) + 8) % 8;
      queueGhost();
      return;
    }
    const d = wd;
    zoomAt(evPos(e).x, evPos(e).y, Math.exp(-d * 0.0015));
    queueGhost();
  }, { passive: false });
  if (!window.__upBound) {
    window.__upBound = true;
    // button released anywhere (not just over the canvas): end every drag.
    // cv's own pointerup handles the common path, but a release over the
    // top bar / dock (or after capture was lost) never reaches it — without
    // this, panDrag survives and mere mouse motion pans the view (and a
    // stuck paint trail keeps spawning units).
    addEventListener("pointerup", () => { painting = false; erasing = false; mouse.down = false; panDrag = null; rDown = null; strokeNew = null; cv.style.cursor = ""; queueGhost(); });
    // focus lost mid-drag (Alt-Tab with a button held): drop all transient
    // input so the return doesn't pan/paint from stale state. Keys have
    // their own blur reset next to the camera-key binding below.
    addEventListener("blur", () => { painting = false; erasing = false; mouse.down = false; panDrag = null; rDown = null; pinch = null; ptrs.clear(); cv.style.cursor = ""; });
  }
}
// If the host ever swaps the canvas node under us, re-grab it so we always
// draw into (and listen on) the live element.
function bindCanvas() {
  const live = document.getElementById("cv");
